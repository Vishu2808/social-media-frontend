<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="../index.html">SocialApp</a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <button><i class="fas fa-search"></i></button>
        </div>
        <div class="navbar-links">
            <a href="../index.html"><i class="fas fa-home"></i></a>
            <a href="#"><i class="fas fa-paper-plane"></i></a>
            <a href="../posts/create.html"><i class="fas fa-plus-square"></i></a>
            <a href="#"><i class="fas fa-compass"></i></a>
            <a href="#"><i class="fas fa-heart"></i></a>
            <a href="profile.html"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <div class="container">
        <main class="profile-main">
            <div class="profile-header">
                <div class="profile-photo">
                    <img src="https://picsum.photos/150" alt="Profile" id="profile-photo">
                    <button class="btn-edit" onclick="location.href='edit.html'">Edit Profile</button>
                </div>
                <div class="profile-info">
                    <div class="profile-stats">
                        <div><strong>125</strong> posts</div>
                        <div><strong>1,234</strong> followers</div>
                        <div><strong>567</strong> following</div>
                    </div>
                    <div class="profile-bio">
                        <h2 id="profile-username">johndoe</h2>
                        <p id="profile-bio">Digital creator | Photography enthusiast</p>
                        <p id="profile-email">john@example.com</p>
                    </div>
                </div>
            </div>

            <div class="profile-tabs">
                <button class="tab-btn active"><i class="fas fa-th"></i> Posts</button>
                <button class="tab-btn"><i class="fas fa-bookmark"></i> Saved</button>
                <button class="tab-btn"><i class="fas fa-tag"></i> Tagged</button>
            </div>

            <div class="profile-posts">
                <!-- Posts will be loaded here -->
                <div class="post-grid">
                    <div class="post-thumbnail">
                        <img src="https://picsum.photos/300/300" alt="Post">
                        <div class="post-overlay">
                            <span><i class="fas fa-heart"></i> 124</span>
                            <span><i class="fas fa-comment"></i> 23</span>
                        </div>
                    </div>
                    <!-- More thumbnails would go here -->
                </div>
            </div>
        </main>
    </div>

    <script src="../script.js"></script>
</body>
</html>
